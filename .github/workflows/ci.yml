name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The one full authority: every hard gate on Linux with GCC, which is also the
  # compiler the project documents for the L0 build.
  ubuntu-gcc:
    runs-on: ubuntu-latest
    env:
      CC: gcc
    steps:
      - uses: actions/checkout@v4
      # TEST-20: the bare-metal smoke needs a cross toolchain and QEMU; without
      # them the probe reports `skip`, which would leave the contract unproven
      # on the one job that is supposed to prove it.
      - name: bare-metal smoke tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi qemu-system-arm
          # TEST-21: the STM32F4 smoke needs Renode; the portable Linux build
          # bundles its .NET runtime, so nothing system-wide is installed.
          mkdir -p .temp/renode-linux
          curl -fsSL -o /tmp/renode.tar.gz \
            https://github.com/renode/renode/releases/download/v1.17.0/renode-1.17.0.linux-portable.tar.gz
          tar -xzf /tmp/renode.tar.gz -C .temp/renode-linux --strip-components=1
          # Headless: `--version` alone can wait for a display on a bare
          # runner, so prove startup with a GUI-less empty machine instead.
          .temp/renode-linux/renode --disable-gui --plain -P -1 \
            -e "mach create" -e "quit"
          # TEST-21/PH-67-R3: FreeRTOS kernel source is fetched, never vendored.
          mkdir -p .temp/FreeRTOS-Kernel
          curl -fsSL -o /tmp/freertos.tar.gz \
            https://codeload.github.com/FreeRTOS/FreeRTOS-Kernel/tar.gz/refs/tags/V11.1.0
          tar -xzf /tmp/freertos.tar.gz -C .temp/FreeRTOS-Kernel --strip-components=1
      - name: hard gates
        run: |
          set -o pipefail
          bash selfhost/check-all.sh 2>&1 | tee /tmp/check-all.log
      - name: failure summary
        if: failure()
        run: |
          msg=$(grep -A12 -m1 -E '^ *FAIL|error:' /tmp/check-all.log | tr '\n' '|')
          echo "::error::${msg:-check-all failed}"
          tail -100 /tmp/check-all.log

  # macOS carries the BSD-only probes test/run.sh skips elsewhere, so it runs
  # the full suite too (Apple clang is the "zero warnings" baseline).
  macos-clang:
    runs-on: macos-latest
    env:
      CC: clang
    steps:
      - uses: actions/checkout@v4
      - name: hard gates
        run: |
          set -o pipefail
          bash selfhost/check-all.sh 2>&1 | tee /tmp/check-all.log
      - name: failure summary
        if: failure()
        run: |
          msg=$(grep -A12 -m1 -E '^ *FAIL|error:' /tmp/check-all.log | tr '\n' '|')
          echo "::error::${msg:-check-all failed}"
          tail -100 /tmp/check-all.log

  # A second Linux compiler, smoke only: the two suites that are most sensitive
  # to compiler differences, without paying for the whole matrix twice.
  ubuntu-clang-smoke:
    runs-on: ubuntu-latest
    env:
      CC: clang
    steps:
      - uses: actions/checkout@v4
      # Ubuntu's `clang` package does not ship libclang_rt.asan; the p44/p50
      # probes link with -fsanitize=address,undefined and skip (rc 77) without
      # it. Install the matching runtime so the job actually exercises them.
      - name: sanitizer runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y "libclang-rt-$(clang -dumpversion | cut -d. -f1)-dev"
      - name: L0 suite
        run: bash test/run.sh
      - name: AST compiler suite
        run: bash selfhost/check-ast.sh
      - name: generated C warning-free
        run: bash selfhost/check-warnings.sh
