name: nightly

on:
  schedule:
    - cron: '0 18 * * *'   # 02:00 Asia/Shanghai
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ASAN/UBSAN over the whole chain, test/run.sh and the test/ast fixtures. Not
  # part of check-all.sh on purpose (D17-6): too slow for the local loop.
  sanitizers:
    runs-on: ubuntu-latest
    env:
      CC: gcc
    steps:
      - uses: actions/checkout@v4
      - name: ASAN + UBSAN
        run: bash selfhost/check-sanitizers.sh

  # Deterministic fuzz with a fixed seed; a failure prints the seed so the same
  # mutation sequence can be replayed locally.
  fuzz:
    runs-on: ubuntu-latest
    env:
      CC: gcc
    steps:
      - uses: actions/checkout@v4
      - name: deterministic fuzz
        run: bash test/fuzz/run.sh

  # TEST-25: line coverage for ct-ast, gcov only, **report only**. There is no
  # threshold and this job is not part of check-all's hard gates: a number is
  # here to show what the corpus did not reach, not to make the suite write
  # tests for a percentage. The raw gcov files and the summary are uploaded so
  # the uncovered sources can be read without re-running the job.
  coverage:
    runs-on: ubuntu-latest
    env:
      CC: gcc
    steps:
      - uses: actions/checkout@v4
      - name: gcov line coverage (report only)
        run: bash test/coverage/run.sh
      - name: upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ct-ast-gcov
          path: .temp/coverage/
          if-no-files-found: warn


  # REQ-CI-1: TSan is documented in check-tsan.sh / v0-PH-41 as nightly; run it
  # here so concurrent regressions actually have a guard.
  tsan:
    runs-on: ubuntu-latest
    env:
      CC: gcc
    steps:
      - uses: actions/checkout@v4
      - name: ThreadSanitizer
        run: bash selfhost/check-tsan.sh

  # REQ-CI-2: ASan's default does not see stack-use-after-return. This job turns
  # the detector on for the existing corpus (report-only until the noise floor
  # is known); it is not part of the local hard gates.
  asan-stack:
    runs-on: ubuntu-latest
    env:
      CC: gcc
      CT_ASAN_STACK: '1'
    steps:
      - uses: actions/checkout@v4
      - name: ASan stack-use-after-return
        run: bash selfhost/check-sanitizers.sh
